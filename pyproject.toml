[project]
name = "certferry"
version = "0.1.0"
description = "Ship cert-manager TLS secrets from Kubernetes to files, hosts and services."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "PyYAML>=6.0",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
certferry = "certferry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/certferry"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT"]
ignore = [
    "S602",  # shell=True is the documented behaviour for string commands
    "S603",  # subprocess with composed argv is the purpose of the tool
    "S607",  # executables are resolved from PATH on purpose (kubectl, ssh, scp)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S604", "PT011", "PT018", "RUF043"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=certferry --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
