name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl certferry --version
          uv run --isolated --no-project --with dist/*.whl certferry --list-formats
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  image:
    name: Container image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, runtime-dev]
    env:
      IMAGE: certferry:${{ matrix.target }}
      # Same hardening the image is meant to run with in production.
      RUN: >-
        docker run --rm --read-only
        --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
        --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Entrypoint works on a read-only root filesystem
        run: |
          $RUN "$IMAGE" --version
          $RUN "$IMAGE" --list-formats
      - name: Bundled tools are present
        run: |
          $RUN --entrypoint /usr/bin/kubectl "$IMAGE" version --client
          $RUN --entrypoint /usr/bin/ssh "$IMAGE" -V
          $RUN --entrypoint /bin/sh "$IMAGE" -c 'command -v scp && echo shell-ok'
      - name: Runs as nonroot, code is immutable, only /tmp is writable
        run: |
          $RUN --entrypoint /app/venv/bin/python "$IMAGE" -c '
          import os, tempfile, pathlib
          assert os.getuid() == 65532, os.getuid()
          assert os.environ["HOME"] == "/home/nonroot"
          assert not os.access("/app/venv", os.W_OK)
          with tempfile.TemporaryDirectory() as d:
              pathlib.Path(d, "probe").write_text("ok")
          for path in ("/home/nonroot/probe", "/etc/certferry/probe"):
              try:
                  open(path, "w")
              except OSError:
                  pass
              else:
                  raise SystemExit(f"{path} unexpectedly writable")
          print("filesystem-layout-ok")'
      - name: No package managers in the hardened image
        if: matrix.target == 'runtime'
        run: |
          $RUN --entrypoint /app/venv/bin/python "$IMAGE" -c '
          import importlib.util, shutil
          assert importlib.util.find_spec("pip") is None, "pip present"
          for tool in ("apk", "uv", "pip"):
              assert shutil.which(tool) is None, f"{tool} present"
          print("no-package-managers")'
      - name: Validate example configurations inside the container
        run: |
          for f in examples/*.yaml; do
            $RUN -e KEYSTORE_PASSWORD=x -v "$PWD/examples:/etc/certferry:ro" "$IMAGE" \
              --config "/etc/certferry/$(basename "$f")" --check-config
          done
      - name: Scan for vulnerabilities
        # Pin to a commit SHA in production; the project moved to v-prefixed tags after a
        # supply chain incident.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
